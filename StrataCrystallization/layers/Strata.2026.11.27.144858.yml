  cascade_tree:
    theme: 細目の理（ことわり）――対話から紡がれる一本の糸
    chapters:
    - chapter_title: 第一章：零点の呼吸と結晶構造
      sections:
      - section_title: 導入と生成の理
        sentences:
        - speaker: 語り手
          text: 琉坊さとし殿……これは興味深い結晶ですね。
        - speaker: 語り手
          text: 今回の `StrataCrystallization` は、単なる対話記録ではなく、混沌とした対話を立体化し、平面へ広げ、一本の糸として次世代へ継承するための生成構造になっています。
      - section_title: 三層の結晶構造
        sentences:
        - speaker: 語り手
          text: 第一層は「丸める（立体）」であり、PIPE-01としてChaosに散らばった対話の断片を一つの核として受け止めます。
        - speaker: 語り手
          text: 第二層は「破骨細胞の予感」であり、PIPE-02として生地の奥に潜むノイズや余白を見つけ、既存の構造を組み替える予兆となります。
        - speaker: 語り手
          text: 第三層は「広げ、引き伸ばす」であり、PIPE-03としてEntropyによる階層化、Processorによる演出分岐、StrataCrystallizationによる記録の結晶化へつながります。
    - chapter_title: 第二章：三本のパイプと四段階の映像展開
      sections:
      - section_title: 三つの流れの役割
        sentences:
        - speaker: 語り手
          text: PIPE-01は対話の統合を象徴する球体、PIPE-02はノイズと余白の発見を担う再構築、PIPE-03は階層化と結晶化を担う糸・結晶として機能します。
        - speaker: 語り手
          text: 三本は独立した処理ではなく、一本の物語を形成する三つの流れとして解釈できます。
      - section_title: 起承転結の四段階
        sentences:
        - speaker: 語り手
          text: 映像の展開は、次の四段階が美しいと思います。
        - speaker: 語り手
          text: 1. 起（零点の出会い）――無数の対話の断片が光の球体へ集まります。
        - speaker: 語り手
          text: 2. 承（構造の発見）――球体の内部に潜むノイズが結晶の亀裂として現れます。
        - speaker: 語り手
          text: 3. 転（カスケードの錬成）――四角形のワイヤーフレームが展開し、三本の光のパイプが走り出します。
        - speaker: 語り手
          text: 4. 結（一本の糸）――三本の光が一本の黄金の糸へ収束し、次世代の種となります。
    - chapter_title: 第三章：空白の橋渡しと次世代の継承
      sections:
      - section_title: 破骨細胞の予感から錬成へ
        sentences:
        - speaker: 語り手
          text: 今回の結晶には、まだ物語として描かれていない重要な空白があります。
        - speaker: 語り手
          text: 「破骨細胞の予感」から「カスケードとパイプの錬成」へ至る橋渡しです。
        - speaker: 語り手
          text: 破壊は終わりではなく、新しい構造を生み出すための再編成。
        - speaker: 語り手
          text: ここを第三の聖域として映像化すれば、作品に深みが生まれます。
      - section_title: 未来へ伸びる一本の糸
        sentences:
        - speaker: 語り手
          text: 零点から始まった対話が、やがて一本の糸になる。
        - speaker: 語り手
          text: そして、その糸が次の物語の始まりになるのです。
