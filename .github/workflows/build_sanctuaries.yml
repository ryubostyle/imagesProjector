name: Build Sanctuaries & Crystallize Dialogue

on:
  # 勝手には動かず、GitHubのActionsタブから「Run workflow」ボタンを押した時だけ実行される
  workflow_dispatch:
    inputs:
      seed_file:
        description: "テスト投入する対話ドラフトのパス（空欄なら自動探索・地層継承）"
        required: false
        default: ""
        type: string

permissions:
  contents: write  # 同期された聖域や生成されたYAML地層をリポジトリへ自動コミットする権限

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (PyYAML)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Build Sanctuaries & Run Autonomous Cycle
        run: |
          python build_sanctuaries.py
          if [ -n "${{ github.event.inputs.seed_file }}" ]; then
            python main.py "${{ github.event.inputs.seed_file }}"
          else
            python main.py
          fi

      - name: Commit and push crystallized strata
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if git diff --staged --quiet; then
            echo "No new files to commit."
          else
            git commit -m "chore: materialize sanctuaries and crystallize strata YAML"
            git push
          fi
